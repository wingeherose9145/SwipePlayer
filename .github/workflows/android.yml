name: Build Professional APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java/Node
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Build Web Assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/ || true
          npm install --force
          npx cap add android

      - name: Native Logic Injection
        run: |
          # 1. 覆盖生成完美的 MainActivity.java (解决 WebView 权限底层限制)
          cat <<EOF > android/app/src/main/java/com/mytiktok/app/MainActivity.java
          package com.mytiktok.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // 强制开启底层文件访问权，允许 WebView 加载 file:// 路径
                  WebSettings settings = this.bridge.getWebView().getSettings();
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
              }
          }
          EOF

          # 2. 覆盖生成 AndroidManifest.xml (声明现代 Android 媒体权限)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="SwipePlayer"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          npx cap sync android

      - name: Build APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SwipePlayer-Standard-v1
          path: android/app/build/outputs/apk/debug/app-debug.apk
