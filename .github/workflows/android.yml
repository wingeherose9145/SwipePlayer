name: Build Professional APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java/Node
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Build Web Assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/ || true
          npm install --force
          npx cap add android

      - name: Native Logic Injection
        run: |
          # 1. 注入强力权限检查逻辑的 MainActivity.java
          mkdir -p android/app/src/main/java/com/mytiktok/app/
          cat <<EOF > android/app/src/main/java/com/mytiktok/app/MainActivity.java
          package com.mytiktok.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // A. 开启 WebView 访问本地文件权限
                  WebSettings s = this.bridge.getWebView().getSettings();
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);

                  // B. Android 11+ 自动检测并跳转
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                              intent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                          } catch (Exception e) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                              startActivity(intent);
                          }
                      }
                  }
              }
          }
          EOF

          # 2. 注入针对 Android 13 优化的 AndroidManifest.xml
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="SwipePlayer"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          npx cap sync android

      - name: Build APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipePlayer-Final-Fix
          path: android/app/build/outputs/apk/debug/app-debug.apk
